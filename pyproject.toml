[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm"
]
build-backend = "setuptools.build_meta"


[project]
name = "car-utils"
authors = [
  { name = "Eric Torstenson", email = "eric.s.torstenson@vumc.org" },
]
description = "Common Python utilities for Carroll lab tools (logging setup, LinkML model loading)."
readme = "README.md"
requires-python = ">=3.10"

dynamic = ["version"]

classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
  "sqlalchemy",
  "requests",
]

[project.optional-dependencies]
dev = [
    "rich",
    "pytest",
]

[tool.setuptools_scm]
version_file = "src/car_utils/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
